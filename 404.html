<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Meanify</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/logos/meanify-logo.svg">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    (function(){
      try { var t = localStorage.getItem('meanify-theme'); if (t === 'light') { document.documentElement.setAttribute('data-theme','light'); } else if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) { document.documentElement.setAttribute('data-theme','light'); } } catch(e){}
    })();
  </script>
</head>
<body>
  <main class="not-found">
    <a href="/" class="navbar__logo" aria-label="Meanify">
      <img src="/logos/meanify-logo.svg" alt="" width="56" height="53">
      <span class="navbar__brand">Meanify</span>
    </a>
    <p class="not-found__code" aria-hidden="true">404</p>
    
    
    <section class="not-found__lang" lang="en">
      <h1 class="not-found__title">Page not found</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a href="/en/" class="btn btn--primary">Go to the homepage</a>
    </section>
    
    
    <section class="not-found__lang" lang="pt-PT">
      <h1 class="not-found__title">Página não encontrada</h1>
      <p>A página que procura não existe ou foi movida.</p>
      <a href="/pt/" class="btn btn--secondary">Ir para a página inicial</a>
    </section>
    
  </main>
</body>
</html>
